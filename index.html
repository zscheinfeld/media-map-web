<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon set (public/favicon/). SVG for modern browsers, PNG/ICO fallbacks,
         iOS home-screen icon, and the Android/PWA manifest. -->
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="icon" href="/favicon/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Chrome-free "app" launch when Added to Home Screen. On iPhone there is no
         JS fullscreen API for pages, so standalone home-screen launch is the only
         way to hide Safari's address/tab bars. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Media Universe" />
    <meta name="theme-color" content="#03060f" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- ITC Franklin Gothic via Adobe Fonts (Typekit). Exposes the CSS family
         "franklin-gothic" (weights 400/600/700). The PNG export can't embed Adobe
         files (license), so it falls back to self-hosted Libre Franklin. -->
    <link rel="preconnect" href="https://use.typekit.net" crossorigin />
    <link rel="stylesheet" href="https://use.typekit.net/qgu2hjm.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_back,arrow_forward,bar_chart,chevron_left,chevron_right,download,history,info,left_panel_close,left_panel_open,linear_scale,list,map,refresh,screen_rotation,search,tune" />
    <title>ESHAP Media Universe</title>
    <meta name="description" content="The Media Universe Map charts the companies shaping media and tech as a living starfield. Each company is a planet, scaled by its market value, with planets clustered in sectors – studios, gaming, large-cap tech, streaming, and more – all held together like galaxies by industry gravity." />
    <!-- Social share previews (Open Graph + X/Twitter). og:image and og:url must be
         absolute URLs on the production domain. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ESHAP Media Universe" />
    <meta property="og:title" content="ESHAP Media Universe" />
    <meta property="og:description" content="The Media Universe Map charts the companies shaping media and tech as a living starfield. Each company is a planet, scaled by its market value, with planets clustered in sectors – studios, gaming, large-cap tech, streaming, and more – all held together like galaxies by industry gravity." />
    <link rel="canonical" href="https://map.eshap.tv/" />
    <!-- Google Search Console ownership check. -->
    <meta name="google-site-verification" content="eO5a1_MuC0xJxPpqP162oftDpH-VX1qoNQrR6Uvlewc" />
    <meta property="og:url" content="https://map.eshap.tv/" />
    <meta property="og:image" content="https://map.eshap.tv/og-image-v2.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Media Universe map: media companies drawn as planets sized by market cap, grouped by sector." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ESHAP Media Universe" />
    <meta name="twitter:description" content="The Media Universe Map charts the companies shaping media and tech as a living starfield. Each company is a planet, scaled by its market value, with planets clustered in sectors – studios, gaming, large-cap tech, streaming, and more – all held together like galaxies by industry gravity." />
    <meta name="twitter:image" content="https://map.eshap.tv/og-image-v2.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
