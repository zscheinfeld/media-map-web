# One-off, run by hand: moves the companies in jobs/manual-switch.json from Google
# Finance to manual entry in Sanity and the sheet (value, data source, source line).
name: Switch companies to manual entry
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write (otherwise a dry run)"
        type: boolean
        default: false
jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: jobs
      - name: Switch to manual
        working-directory: jobs
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: production
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          GF_SHEET_ID: ${{ secrets.GF_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: npm run switch-to-manual -- ${{ inputs.apply && '--apply' || '' }}
