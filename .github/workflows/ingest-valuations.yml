name: Ingest valuations

# RETIRED 2026-09-08 — the live app moved to the Google Finance sheet + reconciler
# (see docs/GOOGLE_FINANCE.md). This FMP ingest is kept ONLY as the rollback path:
# the nightly schedule is disabled so it no longer auto-writes the old FMP sheet,
# but it stays runnable via the "Run workflow" button so you can freshen that sheet
# if you ever flip Netlify's VITE_VALUATIONS_CSV_URL back to the FMP CSV.
# To fully retire: delete this file + the FMP_API_KEY / SHEET_ID secrets.
on:
  # schedule:
  #   - cron: "0 0 * * *" # (disabled) daily at 00:00 UTC — GF sheet is now the live source
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install job deps
        working-directory: jobs
        run: npm install
      - name: Ingest valuations → Google Sheet
        working-directory: jobs
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: production
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: npm run ingest-valuations
